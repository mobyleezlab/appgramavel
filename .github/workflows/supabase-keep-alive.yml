name: Supabase Keep-Alive

# Heartbeat mínimo e legítimo para manter o projeto Supabase ativo.
# Executa um SELECT extremamente leve via REST API (PostgREST) a cada 3 dias.
# Não escreve dados, não usa service_role, não gera tráfego excessivo.
# URL e publishable key são lidas de src/integrations/supabase/client.ts
# (a publishable/anon key é pública por design e já está versionada no código).

on:
  schedule:
    # A cada 3 dias às 12:00 UTC (09:00 horário de Brasília)
    - cron: "0 12 */3 * *"
  workflow_dispatch: # permite execução manual pela aba Actions do GitHub

jobs:
  heartbeat:
    name: Supabase heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Extrair configuração pública do client.ts
        run: |
          set -euo pipefail

          SUPABASE_URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' src/integrations/supabase/client.ts | head -n 1)
          SUPABASE_ANON_KEY=$(grep -oE '"eyJ[A-Za-z0-9._-]+"' src/integrations/supabase/client.ts | head -n 1 | tr -d '"')

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "❌ Não foi possível extrair SUPABASE_URL ou publishable key de client.ts."
            exit 1
          fi

          echo "SUPABASE_URL=${SUPABASE_URL}" >> "${GITHUB_ENV}"
          echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" >> "${GITHUB_ENV}"
          echo "Configuração extraída com sucesso (URL: ${SUPABASE_URL})."

      - name: Ping Supabase (SELECT leve)
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          echo "Iniciando heartbeat em: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          # SELECT de 1 registro, apenas a coluna id — atividade real e mínima no banco.
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/establishments?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json")

          echo "HTTP status: ${HTTP_STATUS}"
          echo "Resposta (truncada): $(head -c 300 /tmp/response.json)"

          if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 300 ]; then
            echo "✅ Heartbeat OK — Supabase respondeu corretamente."
            echo "Executado em: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            exit 0
          else
            echo "❌ Heartbeat FALHOU — status ${HTTP_STATUS}."
            exit 1
          fi
